<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>DIRECCION DE ADMINISTRACION</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="./assets/vendor/bootstrap/css/bootstrap.min.css">
    <link href="./assets/vendor/fonts/circular-std/style.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/libs/css/style.css">
    <link rel="stylesheet" href="./assets/vendor/fonts/fontawesome/css/fontawesome-all.css">
    <script type="text/javascript" src="https://kaspersky-labs.com" charset="UTF-8"></script>
    <style>
    html,
    body {
        height: 100%;
    }

    body {
        display: -ms-flexbox;
        display: flex;
        -ms-flex-align: center;
        align-items: center;
        padding-top: 40px;
        padding-bottom: 40px;
    }
    </style>
    <script src="js/sweetalert.min.js"></script>
    <script language="JavaScript">
        function validar(Reg){
            // Obtenemos los valores ingresados y limpiamos espacios
            var usuarioIngresado = document.Reg.rfc.value.toUpperCase().trim();
            var contrasenaIngresada = document.Reg.password.value;

            // Validación de campos vacíos
            if(usuarioIngresado == "") { 
                swal("Usuario", "El campo de USUARIO es requerido", "warning");
                Reg.rfc.focus();		
                return false;
            }
            if(contrasenaIngresada == "") { 
                swal("Contraseña", "La CONTRASEÑA es requerida", "warning");
                Reg.password.focus();		
                return false;
            }
        
            // Base de datos interna de usuarios permitidos
            var usuariosValidos = {
                "DIRADMIN": "Pr0c3s0.",
                "IGNACIO": "admin",
                "DOMINGO" :"admin"
            };

            // Comprobamos si el usuario existe y si la contraseña coincide
            if (usuariosValidos[usuarioIngresado] && usuariosValidos[usuarioIngresado] === contrasenaIngresada) {
                // Redirección inmediata al sitio oficial una vez validado
                window.location.href = "https://sites.google.com/view/ieem-controlpatrimonial-bodega/p%C3%A1gina-principal"; 
                return false; // Evita el envío por defecto al archivo PHP local
            } else {
                // Mensaje en caso de credenciales incorrectas
                swal("Error de Acceso", "Usuario o contraseña incorrectos", "error");
                return false;
            }
        }
    </script>
    <script language="JavaScript">
        function conMayusculas(field) {
            field.value = field.value.toUpperCase();
        }
    </script>
</head>

<body>
    <!-- ============================================================== -->
    <!-- login page  -->
    <!-- ============================================================== -->
    <div class="splash-container">
        <div class="card ">
            <div class="card-header text-center">
                <!-- URL del logo de Google Drive corregida -->
                <img class="logo-img" src="D:\Bibliotecas/Desktop/WEB/ieemlogo.PNG" alt="logo" width="90%">
                <br><br>
                <span class="splash-description">Escriba el usuario y la contraseña para acceder al sistema</span>
            </div>
            <div class="card-body">
                <!-- Cambiado el comportamiento del formulario para gestionarse puramente por JS -->
                <form action="#" id="Reg" name="Reg" method="post" onSubmit="return false;">
                    <div class="form-group">
                        <input class="form-control form-control-lg" id="rfc" name="rfc" size="13" maxlength="13" type="text" placeholder="USUARIO" onChange="conMayusculas(this)" >
                    </div>
                    <div class="form-group">
                        <input class="form-control form-control-lg" id="password" name="password" type="password" placeholder="CONTRASEÑA" autocomplete="off">
                    </div>
                    <button type="button" onClick="return validar(Reg)" class="btn btn-primary btn-lg btn-block">INGRESAR</button>
                </form>
            </div>
        </div>
    </div>
  
    <!-- ============================================================== -->
    <!-- end login page  -->
    <!-- ============================================================== -->
    <!-- Optional JavaScript -->
    <script src="./assets/vendor/jquery/jquery-3.3.1.min.js"></script>
    <script src="./assets/vendor/bootstrap/js/bootstrap.bundle.js"></script>
</body>
</html>
